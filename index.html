    <meta charset="utf-8">
    <title>OpenMW-Web</title>
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #000;
        overflow: hidden;
      }
      #canvas {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        display: block;
        outline: none;
      }
      #ld {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: #000;
        color: #bbb;
        font: 14px/1 monospace;
      }
      #ld.off {
        display: none;
      }
      #spin {
        width: 36px;
        height: 36px;
        border: 3px solid #333;
        border-top-color: #bbb;
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
      }
      #ld.err #spin {
        animation: none;
        border-top-color: #333;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
