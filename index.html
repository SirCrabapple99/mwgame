    <meta charset="utf-8">
    <title>OpenMW-Web</title>
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #000;
        overflow: hidden;
      }
      #canvas {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        display: block;
        outline: none;
      }
      #ld {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: #000;
        color: #bbb;
        font: 14px/1 monospace;
      }
      #ld.off {
        display: none;
      }
      #spin {
        width: 36px;
        height: 36px;
        border: 3px solid #333;
        border-top-color: #bbb;
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
      }
      #ld.err #spin {
        animation: none;
        border-top-color: #333;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="0"></canvas>
    <div id="ld">
      <div id="spin"></div>
      <div id="mb">0 MB</div>
    </div>
    <script>

        var canvas = document.getElementById("canvas");

          log("window error: " + e.message);
        });

        // Saves/settings live on IDBFS; two syncfs in flight at once race and drop writes, so coalesce.
        var syncing = false,
          syncAgain = false;

          location.reload();
        };
        window.__omwExitToLauncher = function () {
          location.reload();

        window.__omwSkipIntroFlag = false;

        // The build stamps __ENGINE_VERSION__ with a hash and moves openmw.{js,wasm,data} to e/<hash>/.
        // Unstamped (a raw checkout) falls back to flat paths.
        var ENGINE_VER = "__ENGINE_VERSION__";
        var ENGINE_DIR =
          ENGINE_VER.charAt(0) === "_" ? "" : "e/" + ENGINE_VER + "/";

        // "Data Files" sits next to this page, with manifest.json (make-manifest.py) listing it. Every
        // file is mounted as a lazy StreamFS node (HTTP Range reads), so nothing is resident up front.
        function buildLoadOrder(rootFiles) {

            esp = [],
            bsa = [];

            minSize: "0.02",
            shadowRes: "2048",
            shadowDist: "512",
            rtt: "512",
            actors: "3072",
            lru: 48,

            minSize: "0.005",
            shadowRes: "8192",
            shadowDist: "1024",
            rtt: "1024",

            "small feature culling": "true",

            "reflection detail": "0",
            "rain ripple detail": "0",

            "sky blending": "false",

          Shadows: {
            "enable shadows": "false",
            "actor shadows": "false",
            "player shadows": "false",
            "object shadows": "false",
            "terrain shadows": "false",

            "preload doors": "false",
            "preload exterior grid": "false",
            "preload fast travel": "false",
            "preload cell cache min": "4",
            "preload cell cache max": "8",
          },

          Shaders: {
            "max lights": "4",
            "maximum light distance": "2048",
            "force per pixel lighting": "false",
            "antialias alpha test": "false",
            "particle point lighting": "false",
            "soft particles": "false",
            "clamp lighting": "true",
            "apply lighting to environment maps": "false",
            "auto use object normal maps": "false",
            "auto use object specular maps": "false",

          return lines.join("\n") + "\n";
        }
        function forceUserSettings() {
          var f = "/userdata/config/openmw/settings.cfg",
            txt = "";
          try {
            if (FS.analyzePath(f).exists)
              txt = FS.readFile(f, { encoding: "utf8" });
          } catch (e) {}
          FS.writeFile(f, mergeIni(txt, POTATO));
          log("[quality] potato mode: forced low-end settings");
        }

        function settingsCfg() {
          if (isPotato) {
            var base = JSON.parse(JSON.stringify(POTATO));
            base.Video = {
              "resolution x": window.__renderW,
              "resolution y": window.__renderH,
              "window mode": 2,
              gamma: 1.2,
              antialiasing: 0,
            };
            return iniFromMap(base);
          }
          return [
            "[Video]",
            "resolution x = " + window.__renderW,
            "resolution y = " + window.__renderH,
            "window mode = 2",
            "gamma = 1.2",
            "[Camera]",
            "viewing distance = " + TIER.vd + ".0",
            "small feature culling pixel size = 3.0",
            "[Terrain]",
            "distant terrain = true",
            "object paging = true",
            "object paging active grid = true",
            "object paging min size = " + TIER.minSize,
            "object paging merge factor = 250",
            "vertex lod mod = -1",
            "lod factor = 1.0",
            "[Water]",
            "shader = true",
            "reflection detail = 0",
            "refraction = true",
            "rtt size = " + TIER.rtt,
            "rain ripple detail = 2",
            "small feature culling pixel size = 30.0",
            "[Fog]",
            "radial fog = true",
            "use distant fog = true",
            "distant land fog start = 12288",
            "distant land fog end = 16384",
            "sky blending = true",
            "sky blending start = 0.9",
            "[Shadows]",
            "enable shadows = true",
            "shadow map resolution = " + TIER.shadowRes,
            "number of shadow maps = 1",
            "actor shadows = true",
            "player shadows = true",
            "object shadows = false",
            "terrain shadows = true",
            "maximum shadow map distance = " + TIER.shadowDist,
            "[Cells]",
            "preload cell cache max = 18",
            // Preloading is synchronous on this build (the work queue runs inline), so speculative
            // loads only add stalls to the frame that makes them.
            "preload doors = false",
            "preload exterior grid = false",
            "[Game]",
            "actors processing range = " + TIER.actors,
            "[Shaders]",
            "max lights = 16",
            "maximum light distance = 8192",
            "force per pixel lighting = true",
            "antialias alpha test = true",
            "minimum interior brightness = 0.25",
            "particle point lighting = true",
            "clamp lighting = false",
            "match sunlight to sun = true",
            "apply lighting to environment maps = true",
            "auto use object normal maps = true",
            "auto use object specular maps = true",
            "auto use terrain normal maps = true",
            "auto use terrain specular maps = true",
            "soft particles = true",
            "[General]",
            "anisotropy = 16",
            "texture mipmap = linear",
            "[Post Processing]",
            "enabled = true",
            "chain = adjustments",
            "",
          ].join("\n");
        }

        window.Module = {
          locateFile: function (path) {
            return ENGINE_DIR + path;
          },
          canvas: canvas,
          arguments: [],
          preRun: [
            function () {
              try {
                ENV.HOME = "/home/web_user";
                ENV.USER = "player";
                ENV.LOGNAME = "player";
                ENV.OPENMW_DEBUG_LEVEL = "INFO";
                ENV.ICU_DATA = "/";
                // glGetError is a hard GPU sync in WebGL; checking it every frame is a stall.
                ENV.OSG_GL_ERROR_CHECKING = "OFF";
                // User config and data live on the persistent IDBFS mount.
                ENV.XDG_CONFIG_HOME = "/userdata/config";
                ENV.XDG_DATA_HOME = "/userdata/data-home";
                ENV.XDG_CACHE_HOME = "/home/web_user/.cache";
                FS.mkdirTree("/home/web_user/.cache/openmw");
                // Baseline defaults only; the engine layers the persistent user settings.cfg on top.
                FS.writeFile("/settings.cfg", settingsCfg());
                FS.mkdirTree("/userdata");
                try {
                  if (navigator.storage && navigator.storage.persist)
                    navigator.storage.persist();
                } catch (e) {}

                // Persist saves/config: IDBFS at /userdata, loaded before the engine starts.
                var IDBFS = FS.filesystems.IDBFS;
                if (IDBFS) {
                  FS.mount(IDBFS, {}, "/userdata");
                  addRunDependency("idbfs-load");
                  FS.syncfs(true, function (err) {
                    if (err) log("[idbfs] " + err);
                    try {
                      // Created after the mount+load: before it they would be hidden by the mount.
                      FS.mkdirTree("/userdata/data");
                      FS.mkdirTree("/userdata/config/openmw");
                      FS.mkdirTree("/userdata/data-home/openmw");
                      // Marks the user config dir as an active config path so settings are read/written there.
                      if (
                        !FS.analyzePath("/userdata/config/openmw/openmw.cfg")
                          .exists
                      )
                        FS.writeFile(
                          "/userdata/config/openmw/openmw.cfg",
                          "# OpenMW user config dir\n",
                        );
                      if (isPotato) forceUserSettings();
                      window.__omwSyncfs();
                    } catch (e) {
                      log("[idbfs setup] " + e);
                    }
                    removeRunDependency("idbfs-load");
                  });
                  setInterval(window.__omwSync, 15000);
                }

                mountDataFiles();
              } catch (e) {
                fatal("startup error: " + e);
              }
            },
          ],
          print: function (t) {
            console.log(t);
          },
          printErr: function (t) {
            console.warn(t);
          },
          onAbort: function (w) {
            try {
              window.__omwSync();
            } catch (e) {}
            fatal("engine aborted: " + w);
          },
          onRuntimeInitialized: function () {
            // Quietly cache the game archives on disk while playing so later loads don't stall on the
            // network. Opt out: localStorage.omw_nowarm = "1". Skipped on data saver or little free space.
            setTimeout(function () {
              try {
                if (localStorage.getItem("omw_nowarm")) return;
                var cn = navigator.connection;
                if (cn && cn.saveData) return;
                var go = function () {
                  log("[warm] caching archives: " + StreamFS.warm() + " files");
                };
                if (navigator.storage && navigator.storage.estimate)
                  navigator.storage.estimate().then(function (e) {
                    if (e.quota && e.quota - (e.usage || 0) < 2147483648)
                      log("[warm] skipped: under 2GB free storage");
                    else go();
                  });
                else go();
              } catch (e) {}
            }, 20000);
            // Drive frames from a MessageChannel: unlike setTimeout/rAF it is not throttled in a hidden
            // tab. The hop is load-bearing -- running the frame synchronously inside rAF drains SDL's
            // key-event queue before the browser has dispatched the pending keydown, and input dies.
            try {
              var mc = new MessageChannel(),
                scheduled = false,
                trapped = false;
              function scheduleNext() {
                if (scheduled) return;
                scheduled = true;
                if (document.hidden)
                  setTimeout(function () {
                    mc.port2.postMessage(0);
                  }, 33);
                else
                  requestAnimationFrame(function () {
                    mc.port2.postMessage(0);
                  });
              }
              function pumpFrame() {
                scheduled = false;
                try {
                  if (Module._omw_pump_frame) Module._omw_pump_frame();
                } catch (e) {
                  // A wasm trap unwinds past the engine's re-entrancy guard and freezes every later pump.
                  if (!trapped) {
                    trapped = true;
                    fatal("engine crashed: " + ((e && e.message) || e));
                  }
                }
                scheduleNext();
              }
              mc.port1.onmessage = pumpFrame;
              document.addEventListener("visibilitychange", function () {
                if (document.hidden && scheduled) mc.port2.postMessage(0);
              });
              mc.port2.postMessage(0);
            } catch (e) {
              fatal("frame pump failed: " + e);
            }
          },
        };

        // The Data Files folder sits next to this page.
        var DATA = "Data%20Files/";

        function mountDataFiles() {
          FS.mkdirTree("/mwdata");
          addRunDependency("mw-data");
          var rootFiles = new Map(),
            haveVideo = false;
          fetch(DATA + "manifest.json")
            .then(function (r) {
              if (!r.ok)
                throw new Error("no Data Files (HTTP " + r.status + ")");
              return r.json();
            })
            .then(function (list) {
              if (!list.length) throw new Error("Data Files is empty");
              StreamFS.init();
              list.forEach(function (f) {
                var lower = f.p.toLowerCase();
                if (lower.indexOf("/") < 0) rootFiles.set(lower, f.p);
                if (/^video\/.*\.bik$/.test(lower)) haveVideo = true;
                var dir = f.p.lastIndexOf("/");
                if (dir > 0) {
                  try {
                    FS.mkdirTree("/mwdata/" + f.p.slice(0, dir));
                  } catch (e) {}
                }
                // Retail files are immutable, so no mtime in the cache key.
                StreamFS.mount(
                  "/mwdata/" + f.p,
                  DATA + f.p.split("/").map(encodeURIComponent).join("/"),
                  f.s,
                );
              });
              if (!rootFiles.has("morrowind.esm"))
                throw new Error("Morrowind.esm not found in Data Files");
              // The engine's preloaded openmw.cfg arrives with the .data package; rewrite it once present.
              (function waitCfg() {
                if (!FS.analyzePath("/openmw.cfg").exists)
                  return setTimeout(waitCfg, 25);
                var cfg = FS.readFile("/openmw.cfg", { encoding: "utf8" })
                  .split("\n")
                  .filter(function (l) {
                    return (
                      !/^content=/.test(l) &&
                      !/^data=\/gamedata\s*$/.test(l) &&
                      !/^fallback-archive=/.test(l) &&
                      !/^fallback=Movies_/.test(l)
                    );
                  });
                var lo = buildLoadOrder(rootFiles);
                cfg.push("data=/mwdata", 'config="/userdata/config/openmw"');
                lo.fbarch.forEach(function (a) {
                  cfg.push("fallback-archive=" + a);
                });
                lo.content.forEach(function (c) {
                  cfg.push("content=" + c);
                });
                if (haveVideo)
                  cfg.push(
                    "fallback=Movies_Company_Logo,bethesda logo.bik",
                    "fallback=Movies_Morrowind_Logo,mw_logo.bik",
                    "fallback=Movies_New_Game,mw_intro.bik",
                  );
                FS.writeFile("/openmw.cfg", cfg.join("\n"));
                var t0 = performance.now();
                Promise.race([
                  StreamFS.whenReady(),
                  new Promise(function (r) {
                    setTimeout(function () {
                      r("timeout");
                    }, 10000);
                  }),
                ]).then(function (v) {
                  log(
                    v === "timeout"
                      ? "[streamfs] worker did not start in 10s"
                      : "[streamfs] worker ready in " +
                          Math.round(performance.now() - t0) +
                          "ms",
                  );
                  removeRunDependency("mw-data");
                });
              })();
            })
            .catch(function (e) {
              fatal(String((e && e.message) || e));
            });
        }

        window.__omwEngineSrc = ENGINE_DIR + "openmw.js";
      })();
    </script>
    <script src="streamfs.js"></script>
    <script>
      if (!window.__omwFailed)
        (function () {
          // Workers can't be constructed from a cross-origin script URL (e.g. when this page is
          // hosted on a CDN and embedded elsewhere), so hand emscripten a same-origin blob for its
          // pthread workers.
          function boot() {
            var s = document.createElement("script");
            s.src = window.__omwEngineSrc;
            s.onerror = function () {
              window.__omwFatal("could not load " + s.src);
            };
            document.body.appendChild(s);
          }
          fetch(window.__omwEngineSrc)
            .then(function (r) {
              if (!r.ok) throw new Error("HTTP " + r.status);
              return r.blob();
            })
            .then(function (b) {
              window.Module.mainScriptUrlOrBlob = new Blob([b], {
                type: "text/javascript",
              });
            })
            .catch(function (e) {
              console.warn("engine blob fetch failed", e);
            })
            .then(boot);
        })();
    </script>
  

</body></html>
